    <div class="nav-section-title">学习</div>
    <ul class="nav-list">
      <li><a class="nav-item" href="index.html" data-nav="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </a></li>
      <li><a class="nav-item" href="review.html" data-nav="review">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>

      </a></li>
      <li><a class="nav-item" href="#" data-nav="new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span>学习新单词</span>
      </a></li>
    </ul>

    <div class="nav-section-title">素材库</div>
    <ul class="nav-list">
      <li><a class="nav-item" href="words.html" data-nav="words">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>单词本</span>
      </a></li>
      <li><a class="nav-item" href="dialogues.html" data-nav="dialogues">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg>
        <span>对话集</span>
      </a></li>
    </ul>

    <div class="nav-footer">
      <ul class="nav-list">

  <!-- ============ Main Content ============ -->
  <main class="app-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">单词本</h1>
        <p class="page-subtitle">共 <strong id="totalCount">0</strong> 个单词 · 支持搜索、标签筛选</p>
      </div>
      <button class="btn btn-primary" onclick="openModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        添加单词
      </button>
    </div>

    <!-- Tag filter chips -->
    <div style="display:flex; gap:8px; margin-bottom: var(--space-4); flex-wrap: wrap; align-items:center;">
      <span style="font-size: var(--text-xs); color: var(--color-text-muted); margin-right: 4px;">标签筛选:</span>
      <button class="tag tag-primary" onclick="filterByTag('')" data-filter="">全部</button>
      <span id="tagChips"></span>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <div class="table-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="搜索单词或释义...">
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost btn-sm" onclick="exportJSON()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            导出 JSON
          </button>
        </div>
      </div>
      <table class="word-table">
        <thead>
          <tr>
            <th style="width: 28%;">单词</th>
            <th>释义</th>
            <th>标签</th>
            <th style="width: 100px;">状态</th>
            <th style="width: 110px;">下次复习</th>
            <th style="width: 50px;"></th>
          </tr>
        </thead>
        <tbody id="wordTable"></tbody>
      </table>
    </div>

  </main>
</div>

<!-- ============ Add/Edit Modal ============ -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">添加新单词</h3>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">英文 *</label>
        <input class="form-input" id="fEnglish" placeholder="serendipity">
      </div>
      <div class="form-group">
        <label class="form-label">中文释义 *</label>
        <input class="form-input" id="fChinese" placeholder="意外发现美好事物的运气">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">音标</label>
          <input class="form-input" id="fPhonetic" placeholder="/ˌserənˈdɪpəti/">
        </div>
        <div class="form-group">
          <label class="form-label">标签 (逗号分隔)</label>
          <input class="form-input" id="fTags" placeholder="雅思, 电影台词">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">例句</label>
        <textarea class="form-textarea" id="fExample" placeholder="英文例句..."></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap: 12px; margin-top: var(--space-6);">
        <button class="btn btn-outline" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveWord()">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="mock.js"></script>
<script src="api.js"></script>
<script>
/* --- Active nav state --- */
document.querySelectorAll('.nav-item').forEach(item => {
  if (item.dataset.nav === document.body.dataset.page) item.classList.add('active');
});

/* --- State --- */
let currentTag = '';
let currentSearch = '';

/* --- Render tag chips --- */
function renderTags() {
  const chips = getAllTags();
  document.getElementById('tagChips').innerHTML = chips.map(t =>
    `<button class="tag" data-filter="${t}" onclick="filterByTag('${t}')" style="${t === currentTag ? 'background: var(--color-primary-soft); color: var(--color-primary-hover);' : ''}">${t}</button>`
  ).join('');
}

function filterByTag(tag) {
  currentTag = tag;
  renderTags();
  render();
}

/* --- Render words table --- */
async function render() {
  const r = await fetchWords({ search: currentSearch, tag: currentTag });
  const list = r.data;
  document.getElementById('totalCount').textContent = list.length;

  const stateMap = [
    { cls: 'srs-new', text: '新词' },
    { cls: 'srs-learning', text: '学习中' },
    { cls: 'srs-review', text: '复习中' },
    { cls: 'srs-mastered', text: '已掌握' }
  ];

  const fmtDate = ts => {
    if (!ts) return '—';
    const diff = Math.ceil((ts - Date.now()) / 86400000);
    if (diff < 0) return '<span style="color: var(--color-danger);">已到期</span>';
    if (diff === 0) return '<span style="color: var(--color-warning);">今天</span>';
    return diff + ' 天后';
  };

  const tbody = document.getElementById('wordTable');
  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state" style="padding: 48px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <div class="title">没有找到单词</div>
      <div class="desc">换个搜索词试试，或者添加新单词</div>
    </div></td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(w => {
    const s = w.repetitions === 0 ? stateMap[0] : w.repetitions < 3 ? stateMap[1] : w.repetitions < 5 ? stateMap[2] : stateMap[3];
    return `
      <tr>
        <td>
          <div class="word-en">${w.english}</div>
          <div class="word-phonetic">${w.phonetic || ''}</div>
        </td>
        <td class="word-cn">${w.chinese}</td>
        <td>${(w.tags || []).map(t => `<span class="tag" style="margin-right:4px;">${t}</span>`).join('')}</td>
        <td><span class="srs-dot ${s.cls}"></span>${s.text}</td>
        <td>${fmtDate(w.nextReview)}</td>
        <td>
          <button class="btn btn-ghost btn-sm" onclick="deleteWord('${w.id}')" title="删除">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </td>
      </tr>`;
  }).join('');
}

/* --- Search --- */
document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value;
  render();
});

/* --- CRUD --- */
function openModal(data) {
  document.getElementById('modalTitle').textContent = data ? '编辑单词' : '添加新单词';
  document.getElementById('fEnglish').value = data?.english || '';
  document.getElementById('fChinese').value = data?.chinese || '';
  document.getElementById('fPhonetic').value = data?.phonetic || '';
  document.getElementById('fTags').value = (data?.tags || []).join(', ');
  document.getElementById('fExample').value = data?.example || '';
  document.getElementById('editModal').classList.add('open');
}
function closeModal() { document.getElementById('editModal').classList.remove('open'); }

async function saveWord() {
  const payload = {
    english: document.getElementById('fEnglish').value.trim(),
    chinese: document.getElementById('fChinese').value.trim(),
    phonetic: document.getElementById('fPhonetic').value.trim(),
    tags: document.getElementById('fTags').value.split(',').map(s => s.trim()).filter(Boolean),
    example: document.getElementById('fExample').value.trim()
  };
  if (!payload.english || !payload.chinese) {
    alert('英文和中文释义必填'); return;
  }
  await createWord(payload);
  closeModal();
  renderTags();
  render();
}

async function deleteWord(id) {
  if (!confirm('确定删除这个单词？')) return;
  await deleteWord(id);
  render();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(DB.words, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vocabulary-export.json';
  a.click();
}

/* --- Init --- */
renderTags();
render();
</script>
</body>
</html>
