<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memorize · 首页</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
<div class="app-shell">

  <!-- ============ App Shell / Sidebar Nav (frozen, identical on every page) ============ -->
  <aside class="app-nav">
    <div class="nav-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div>
        <div class="brand-text">Memorize</div>
        <div class="brand-sub">记单词 · 记对话</div>
      </div>
    </div>

    <div class="nav-section-title">学习</div>
    <ul class="nav-list">
      <li><a class="nav-item" href="index.html" data-nav="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </a></li>
      <li><a class="nav-item" href="review.html" data-nav="review">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>今日复习</span>
        <span class="nav-badge" id="navDueCount">5</span>
      </a></li>
      <li><a class="nav-item" href="#" data-nav="new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span>学习新单词</span>
      </a></li>
    </ul>

    <div class="nav-section-title">素材库</div>
    <ul class="nav-list">
      <li><a class="nav-item" href="words.html" data-nav="words">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>单词本</span>
      </a></li>
      <li><a class="nav-item" href="dialogues.html" data-nav="dialogues">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg>
        <span>对话集</span>
      </a></li>
    </ul>

    <div class="nav-footer">
      <ul class="nav-list">
        <li><a class="nav-item" href="#" data-nav="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>设置</span>
        </a></li>
      </ul>
    </div>
  </aside>

  <!-- ============ Main Content ============ -->
  <main class="app-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">下午好，Alex 👋</h1>
        <p class="page-subtitle">今天有 <strong id="dueCountText">5</strong> 个单词等你复习 · 连续学习 <strong>12</strong> 天</p>
      </div>
      <div style="display:flex; gap:12px;">
        <a href="#" class="btn btn-outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          导出数据
        </a>
        <a href="review.html" class="btn btn-primary btn-lg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          开始今日复习
        </a>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">累计单词</div>
        <div class="stat-value">142<span class="unit">个</span></div>
        <div class="stat-trend up">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          本周 +12
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今日待复习</div>
        <div class="stat-value" style="color: var(--color-warning);">5<span class="unit">个</span></div>
        <div class="stat-trend" style="color: var(--color-text-muted);">上次复习 昨天 21:30</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已掌握</div>
        <div class="stat-value" style="color: var(--color-primary);">38<span class="unit">个</span></div>
        <div class="stat-trend up">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          正确率 82%
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label">对话素材</div>
        <div class="stat-value">24<span class="unit">段</span></div>
        <div class="stat-trend" style="color: var(--color-text-muted);">覆盖 电影 / 书籍 / 演讲</div>
      </div>
    </div>

    <!-- Two column layout -->
    <div style="display:grid; grid-template-columns: 2fr 1fr; gap: var(--space-6); margin-bottom: var(--space-8);">

      <!-- Heatmap -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-4);">
          <div class="card-title">学习热力图 · 过去一年</div>
          <span class="tag">总计 284 天</span>
        </div>
        <div class="heatmap" id="heatmap"></div>
        <div class="heatmap-legend">
          <span>少</span>
          <div class="heatmap-cell"></div>
          <div class="heatmap-cell l1"></div>
          <div class="heatmap-cell l2"></div>
          <div class="heatmap-cell l3"></div>
          <div class="heatmap-cell l4"></div>
          <span>多</span>
        </div>
      </div>

      <!-- Quick actions -->
      <div class="card">
        <div class="card-title">快速操作</div>
        <div style="display:flex; flex-direction:column; gap: var(--space-3);">
          <button class="btn btn-outline" style="justify-content:flex-start;" onclick="openWordModal()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            添加新单词
          </button>
          <button class="btn btn-outline" style="justify-content:flex-start;" onclick="openDialogueModal()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            添加对话素材
          </button>
          <a href="words.html" class="btn btn-ghost" style="justify-content:flex-start;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            浏览单词本 →
          </a>
        </div>
      </div>
    </div>

    <!-- Recent words -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-4);">
        <div class="card-title">最近添加的单词</div>
        <a href="words.html" class="btn btn-ghost btn-sm">查看全部 →</a>
      </div>
      <table class="word-table">
        <thead>
          <tr>
            <th style="width: 40%;">单词</th>
            <th>释义</th>
            <th>状态</th>
            <th>下次复习</th>
          </tr>
        </thead>
        <tbody id="recentWords"></tbody>
      </table>
    </div>

  </main>
</div>

<!-- ============ Add Word Modal ============ -->
<div class="modal-overlay" id="wordModal">
  <div class="modal">
    <div class="modal-header">
      <h3>添加新单词</h3>
      <button class="modal-close" onclick="closeModal('wordModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">英文 *</label>
        <input class="form-input" placeholder="例如: serendipity">
      </div>
      <div class="form-group">
        <label class="form-label">中文释义 *</label>
        <input class="form-input" placeholder="例如: 意外发现美好事物的运气">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">音标</label>
          <input class="form-input" placeholder="/ˌserənˈdɪpəti/">
        </div>
        <div class="form-group">
          <label class="form-label">标签</label>
          <input class="form-input" placeholder="逗号分隔, 如: 雅思, 电影台词">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">例句</label>
        <textarea class="form-textarea" placeholder="英文例句，帮助理解语境..."></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap: 12px; margin-top: var(--space-6);">
        <button class="btn btn-outline" onclick="closeModal('wordModal')">取消</button>
        <button class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ Add Dialogue Modal ============ -->
<div class="modal-overlay" id="dialogueModal">
  <div class="modal">
    <div class="modal-header">
      <h3>添加对话素材</h3>
      <button class="modal-close" onclick="closeModal('dialogueModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">标题 *</label>
        <input class="form-input" placeholder="例如: Friends S01E01 · 咖啡馆偶遇">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">来源</label>
          <input class="form-input" placeholder="例如: Friends 老友记">
        </div>
        <div class="form-group">
          <label class="form-label">分类</label>
          <select class="form-input">
            <option>电影/剧集</option>
            <option>书籍</option>
            <option>演讲</option>
            <option>日常/工作</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">对话内容 *</label>
        <textarea class="form-textarea" style="min-height: 180px;" placeholder="粘贴或输入对话文本，每行一个说话人..."></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap: 12px; margin-top: var(--space-6);">
        <button class="btn btn-outline" onclick="closeModal('dialogueModal')">取消</button>
        <button class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="mock.js"></script>
<script src="api.js"></script>
<script>
/* --- Active nav state --- */
document.querySelectorAll('.nav-item').forEach(item => {
  if (item.dataset.nav === document.body.dataset.page) {
    item.classList.add('active');
  }
});

/* --- Heatmap --- */
const heatmap = document.getElementById('heatmap');
DB.heatmap.forEach(lvl => {
  const cell = document.createElement('div');
  cell.className = 'heatmap-cell' + (lvl > 0 ? ' l' + lvl : '');
  heatmap.appendChild(cell);
});

/* --- Due count --- */
fetchDueWords().then(r => {
  document.getElementById('navDueCount').textContent = r.data.length;
  document.getElementById('dueCountText').textContent = r.data.length;
});

/* --- Recent words table --- */
fetchOverview().then(r => {
  const tbody = document.getElementById('recentWords');
  const fmt = ts => {
    if (!ts) return '—';
    const diff = Math.ceil((ts - Date.now()) / 86400000);
    if (diff < 0) return '已到期';
    if (diff === 0) return '今天';
    return diff + ' 天后';
  };
  const stateMap = [
    { cls: 'srs-new', text: '新词' },
    { cls: 'srs-learning', text: '学习中' },
    { cls: 'srs-review', text: '复习中' },
    { cls: 'srs-mastered', text: '已掌握' }
  ];
  r.data.recentWords.forEach(w => {
    const state = w.repetitions === 0 ? stateMap[0] : w.repetitions < 3 ? stateMap[1] : w.repetitions < 5 ? stateMap[2] : stateMap[3];
    tbody.innerHTML += `
      <tr>
        <td>
          <div class="word-en">${w.english}</div>
          <div class="word-phonetic">${w.phonetic || ''}</div>
        </td>
        <td class="word-cn">${w.chinese}</td>
        <td><span class="srs-dot ${state.cls}"></span>${state.text}</td>
        <td style="color: var(--color-text-sub);">${fmt(w.nextReview)}</td>
      </tr>`;
  });
});

/* --- Modals --- */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function openWordModal() { openModal('wordModal'); }
function openDialogueModal() { openModal('dialogueModal'); }
// close on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});
</script>
</body>
</html>
